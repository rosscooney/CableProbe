# CableProbe default detection rules (v0.1)
#
# Each rule matches a "delta" (something that appeared / disappeared / changed
# between the baseline, test and post-test phases) and raises a finding.
#
# Match vocabulary:
#   change:                appeared | disappeared | modified   (string or list)
#   kind:                  usb_device | usb_interface | usb_descriptor |
#                          usb_pd | usb_topology | hid_report | block_device |
#                          mount | network_interface | network_config |
#                          listening_socket | outbound_connection |
#                          connection_frequency |
#                          persistence_item | input_device | hid_device |
#                          serial_device | audio_device | video_device |
#                          pci_device | kernel_module | wifi_ap |
#                          keystroke_timing | power_reading | process |
#                          kernel_message
#   first_seen_phase:      baseline | test | post_test
#   reverted_after_disconnect: true | false
#   transient:             true | false   (seen only via a udev event)
#   label_regex:           regex (case-insensitive) against the delta label
#   event_action:          add | remove | bind | ...  (requires a related event)
#   attributes:
#     all: [ {key, equals|not_equals|exists|contains|not_contains|regex}, ... ]
#     any: [ ... ]
#
# severity: info | low | medium | high | critical

version: 1

# Reusable list of "real device" observation kinds (excludes process /
# kernel_message, which have their own normal churn).
device_kinds: &device_kinds
  - usb_device
  - usb_interface
  - block_device
  - network_interface
  - input_device
  - hid_device
  - serial_device
  - audio_device
  - video_device
  - pci_device

rules:
  - id: hid-keyboard-appeared-on-connect
    title: HID keyboard appeared while the unknown cable was connected
    severity: high
    rationale: >
      A keyboard-class HID device that enumerates only when the cable is
      connected is the classic signature of a BadUSB / keystroke-injection
      implant hidden inside the cable or connector.
    match:
      change: appeared
      first_seen_phase: test
      kind: [input_device, hid_device]
      attributes:
        any:
          - { key: ID_INPUT_KEYBOARD, equals: "1" }
          - { key: capabilities, contains: keyboard }

  - id: hid-pointer-appeared-on-connect
    title: HID pointing device appeared while the unknown cable was connected
    severity: high
    rationale: >
      A mouse / touchpad / tablet HID device appearing on connect can be used
      for pointer-based injection or to defeat "are you sure?" prompts.
    match:
      change: appeared
      first_seen_phase: test
      kind: [input_device, hid_device]
      attributes:
        any:
          - { key: ID_INPUT_MOUSE, equals: "1" }
          - { key: capabilities, contains: mouse }
          - { key: capabilities, contains: touchpad }
          - { key: capabilities, contains: tablet }

  - id: hid-generic-appeared-on-connect
    title: Non-keyboard/pointer HID device appeared while the unknown cable was connected
    severity: medium
    rationale: >
      A human-interface device that is not a plain keyboard or pointer (a
      consumer-control collection, a vendor HID, ...) appearing only when the
      cable is connected is unexpected for a charge/data cable. Keyboards and
      pointers have their own higher-severity rules, so this does not
      double-report them.
    match:
      change: appeared
      first_seen_phase: test
      kind: [input_device, hid_device]
      attributes:
        all:
          - { key: ID_INPUT_KEYBOARD, not_equals: "1" }
          - { key: ID_INPUT_MOUSE, not_equals: "1" }
          - { key: capabilities, not_contains: keyboard }
          - { key: capabilities, not_contains: mouse }

  - id: network-interface-appeared-on-connect
    title: Network interface appeared while the unknown cable was connected
    severity: high
    rationale: >
      A USB CDC/RNDIS/NCM ethernet gadget lets a malicious cable present itself
      as a network device, enabling DNS/gateway hijacking or traffic capture.
    match:
      change: appeared
      first_seen_phase: test
      kind: network_interface

  - id: rndis-gadget-kernel-signature
    title: Kernel logged an RNDIS network gadget during the test phase
    severity: high
    rationale: >
      RNDIS is Microsoft's USB-networking protocol. Legitimate USB ethernet
      dongles use CDC / NCM; RNDIS on connect is strongly associated with
      implant cables that want a network path into a Windows host. (A plain
      ethernet adapter is already caught by network-interface-appeared and
      gadget-driver-module-loaded, so this rule is RNDIS-only.)
    match:
      change: appeared
      first_seen_phase: test
      kind: kernel_message
      label_regex: "rndis"

  - id: mass-storage-appeared-on-connect
    title: Storage device appeared while the unknown cable was connected
    severity: high
    rationale: >
      A mass-storage device enumerating on connect can be used to auto-run
      content, exfiltrate data, or deliver payloads to the host.
    match:
      change: appeared
      first_seen_phase: test
      kind: block_device
      attributes:
        any:
          - { key: transport, equals: usb }
          - { key: hotplug, equals: "True" }
          - { key: removable, equals: "True" }

  - id: mass-storage-appeared-generic
    title: A block device of unconfirmed transport appeared while the cable was connected
    severity: medium
    rationale: >
      A new block device correlated with the cable connection whose transport
      could NOT be confirmed as USB / hotplug / removable. If it were confirmed
      the higher-severity rule above would have caught it, so this only fires
      for the ambiguous case.
    match:
      change: appeared
      first_seen_phase: test
      kind: block_device
      attributes:
        all:
          - { key: transport, not_equals: usb }
          - { key: hotplug, not_equals: "True" }
          - { key: removable, not_equals: "True" }

  - id: serial-device-appeared-on-connect
    title: Serial / modem device appeared while the unknown cable was connected
    severity: medium
    rationale: >
      A CDC-ACM / USB serial interface appearing on connect can expose an AT
      command or debug channel controlled by the cable.
    match:
      change: appeared
      first_seen_phase: test
      kind: serial_device

  - id: audio-video-appeared-on-connect
    title: Audio or video capture device appeared while the unknown cable was connected
    severity: medium
    rationale: >
      An unexpected audio or UVC video device could be used for covert capture.
    match:
      change: appeared
      first_seen_phase: test
      kind: [audio_device, video_device]

  - id: usb-hub-appeared-on-connect
    title: USB hub appeared while the unknown cable was connected
    severity: low
    rationale: >
      A hidden hub inside a cable is how multiple malicious interfaces (HID +
      storage + network) are attached behind a single connector.
    match:
      change: appeared
      first_seen_phase: test
      kind: usb_device
      attributes:
        any:
          - { key: device_class, equals: "09" }
          - { key: interface_classes, contains: hub }

  - id: usb-composite-with-hid
    title: Composite USB device including an HID interface appeared on connect
    severity: high
    rationale: >
      A device advertising several interface classes, one of them HID, that
      appears on connect is a strong implant signature.
    match:
      change: appeared
      first_seen_phase: test
      kind: usb_device
      attributes:
        all:
          - { key: interface_classes, contains: hid }
          - { key: interface_count, not_equals: "1" }

  - id: usb-device-did-not-revert
    title: Device that appeared on connect did NOT disappear after disconnect
    severity: medium
    rationale: >
      A device that persists in the kernel's view after the cable is removed
      may indicate a driver/interface that was left registered, or that the
      operator did not fully remove the cable. Investigate.
    match:
      change: appeared
      first_seen_phase: test
      reverted_after_disconnect: false
      kind: *device_kinds

  - id: device-appeared-after-disconnect
    title: Device appeared only after the cable was disconnected
    severity: low
    rationale: >
      Delayed enumeration after disconnect can indicate a timer-based payload
      or a slow-settling bus. Correlate with kernel messages.
    match:
      change: appeared
      first_seen_phase: post_test
      kind: *device_kinds

  - id: transient-device-during-test
    title: A device briefly attached and detached during the test phase
    severity: medium
    rationale: >
      A device that enumerated and then removed itself within the test window
      (never captured in a steady-state snapshot) is characteristic of a
      short-lived injection payload. Restricted to real device kinds - a
      process, a kernel log line, or a socket flickering in and out between
      polls is routine host churn, not a device enumerating.
    match:
      change: appeared
      first_seen_phase: test
      transient: true
      kind: *device_kinds

  - id: kernel-enumeration-errors
    title: Kernel reported USB enumeration errors during the test phase
    severity: low
    rationale: >
      Descriptor-read failures, "unable to enumerate", over-current or
      "not accepting address" during the test phase can indicate a
      non-compliant or actively misbehaving device.
    match:
      change: appeared
      first_seen_phase: test
      kind: kernel_message
      label_regex: "descriptor read|unable to enumerate|over-current|not accepting address|-71|-110"

  - id: unexpected-usb-device-appeared
    title: An unrecognised USB device appeared while the cable was connected
    severity: info
    rationale: >
      Baseline catch-all: any USB device that appears in correlation with the
      cable is worth recording even if no specific rule matched it.
    match:
      change: appeared
      first_seen_phase: test
      kind: usb_device

  - id: new-process-after-connect
    title: A new process started in correlation with the cable connection
    severity: info
    rationale: >
      Low-confidence signal. Auto-mount helpers, ModemManager probing, or
      network configuration daemons may start in response to a new device.
    match:
      change: appeared
      first_seen_phase: test
      kind: process

  # --- descriptor-level (usb_descriptors probe) --------------------------

  - id: hid-interface-appeared-on-connect
    title: A USB HID interface appeared while the unknown cable was connected
    severity: high
    rationale: >
      An interface of class HID enumerating on connect is the descriptor-level
      view of a keystroke/pointer injection implant, and is caught even when
      udev does not label a matching input device.
    match:
      change: appeared
      first_seen_phase: test
      kind: usb_interface
      attributes:
        all:
          - { key: interface_class_name, equals: hid }

  - id: storage-interface-appeared-on-connect
    title: A USB mass-storage interface appeared while the unknown cable was connected
    severity: high
    rationale: >
      A mass-storage class interface on connect means the cable can present
      readable/writable media to the host.
    match:
      change: appeared
      first_seen_phase: test
      kind: usb_interface
      attributes:
        all:
          - { key: interface_class_name, equals: mass-storage }

  - id: vendor-specific-interface-appeared-on-connect
    title: A vendor-specific USB interface appeared while the unknown cable was connected
    severity: medium
    rationale: >
      Vendor-specific (class 0xff) interfaces carry proprietary protocols and
      are a common way for an implant to expose a covert control channel that
      no standard driver will flag.
    match:
      change: appeared
      first_seen_phase: test
      kind: usb_interface
      attributes:
        all:
          - { key: interface_class_name, equals: vendor-specific }

  - id: device-interface-set-changed
    title: The interface set of an already-present USB device changed on connect
    severity: high
    rationale: >
      A device that stays enumerated but whose advertised interface classes or
      interface count change during the test phase is exhibiting descriptor
      morphing - presenting a benign face until a trigger.
    match:
      change: modified
      first_seen_phase: test
      kind: usb_interface
      attributes:
        any:
          - { key: device_interface_classes, exists: true }
          - { key: device_num_interfaces, exists: true }

  - id: hid-interface-has-bulk-endpoint
    title: An HID interface with a bulk endpoint appeared on connect
    severity: medium
    rationale: >
      HID devices (keyboards, mice) use interrupt endpoints. A bulk endpoint on
      an HID interface is unusual and is a way to move bulk data - a file, a
      command stream - under cover of the HID class.
    match:
      change: appeared
      first_seen_phase: test
      kind: usb_interface
      attributes:
        all:
          - { key: hid_with_bulk_endpoint, equals: "True" }

  - id: usb-device-multiple-configurations
    title: A USB device with more than one configuration appeared on connect
    severity: medium
    rationale: >
      Almost every real device has exactly one USB configuration. A device with
      two or more can present a benign configuration to the host and switch to a
      payload configuration on a trigger.
    match:
      change: appeared
      first_seen_phase: test
      kind: usb_descriptor
      attributes:
        all:
          - { key: multi_config, equals: "True" }

  # --- HID report descriptors (hid_report probe) --------------------------

  - id: hid-descriptor-can-inject-keystrokes
    title: A device can send keystrokes but did not register as a keyboard
    severity: high
    rationale: >
      This device's HID report descriptor contains keyboard usages - it is
      capable of sending key presses to the host - yet it enumerated as
      something other than a keyboard. That is exactly how an implant injects
      input while appearing to be a mouse, a "vendor device", or a dongle.
    match:
      change: [appeared, modified]
      first_seen_phase: test
      kind: hid_report
      attributes:
        all:
          - { key: keyboard_capable_but_not_labelled, equals: "True" }

  - id: hid-descriptor-vendor-channel
    title: An HID device mixes a standard input capability with a vendor-defined page
    severity: medium
    rationale: >
      A report descriptor that declares both a normal input usage (keyboard /
      pointer) and a vendor-defined usage page can use the vendor page as a
      covert two-way channel that no standard driver will surface.
    match:
      change: [appeared, modified]
      first_seen_phase: test
      kind: hid_report
      attributes:
        all:
          - { key: vendor_page_with_input, equals: "True" }

  # --- persistence surface (persistence probe) --------------------------

  - id: persistence-point-changed-during-session
    title: A boot / device-event / login file changed during the session
    severity: critical
    rationale: >
      A file that controls what runs at boot, on a udev event, or at login -
      a systemd unit, a udev rule, cron, rc.local, ld.so.preload,
      authorized_keys, /etc/hosts - appeared or had its contents change while
      CableProbe was watching (during the test phase OR after the cable was
      unplugged). This is how a payload survives a reboot. CableProbe cannot
      prove the cable caused it, but the timing is the concern - treat the host
      as compromised until you have reviewed the change.
    match:
      change: [appeared, modified]
      first_seen_phase: [test, post_test]
      kind: persistence_item

  - id: persistence-point-removed-during-session
    title: A boot / device-event / login file was deleted during the session
    severity: critical
    rationale: >
      A file CableProbe was fingerprinting for changes - a udev rule, a systemd
      unit, ld.so.preload, authorized_keys, /etc/hosts - disappeared while the
      session was running. Removing a security-relevant file (a hardening udev
      rule, an allow/deny list) is as much an attack as adding one. Review what
      was removed and why.
    match:
      change: disappeared
      kind: persistence_item

  - id: persistence-item-became-unreadable
    title: A persistence file changed into something CableProbe can no longer fingerprint
    severity: high
    rationale: >
      A monitored persistence file turned into a symlink, a FIFO, or otherwise
      stopped being a plain readable file during the session. That defeats
      change detection for it and is not a normal thing for these paths to do.
    match:
      change: modified
      kind: persistence_item
      attributes:
        all:
          - { key: fingerprint_incomplete, equals: "True" }

  # --- outbound connections (connections probe, off by default) --------------------------

  - id: new-outbound-connection-on-connect
    title: A new outbound network connection appeared while the cable was connected
    severity: medium
    rationale: >
      On a properly isolated test host there should be no outbound network
      activity at all. A connection to a routable host that appears in
      correlation with the cable is the cable's payload or network gadget
      phoning home - note the remote address.
    match:
      change: appeared
      first_seen_phase: test
      kind: outbound_connection

  - id: repeated-outbound-connection-during-test
    title: The same remote host was contacted repeatedly during the test phase
    severity: medium
    rationale: >
      A single glimpse of an outbound connection can be a timing coincidence
      with a legitimate background process; the *same* remote host showing up
      across most of the test phase's samples is a beaconing pattern - a
      payload checking in - not a one-off. Only meaningful on a test host with
      no other network activity (see the `connections` probe notes).
    match:
      change: appeared
      first_seen_phase: test
      kind: connection_frequency
      attributes:
        all:
          - { key: repeated, equals: "True" }

  # --- USB-C / Power Delivery (usbc_pd probe) --------------------------

  - id: typec-partner-attached-on-connect
    title: A USB-C partner attached while the unknown cable was connected
    severity: low
    rationale: >
      Expected when the device under test is itself USB-C, but recorded so the
      partner's advertised identity and alt modes are in the report.
    match:
      change: appeared
      first_seen_phase: test
      kind: usb_pd
      label_regex: "partner"

  - id: typec-data-role-changed-on-connect
    title: The USB-C data role changed while the unknown cable was connected
    severity: high
    rationale: >
      A cable presented as charge-only that negotiates or swaps into a data
      role (host/device) is asserting a capability it should not need.
    match:
      change: modified
      first_seen_phase: test
      kind: usb_pd
      attributes:
        all:
          - { key: data_role, exists: true }

  - id: typec-alt-mode-entered-on-connect
    title: A USB-C alternate mode (DisplayPort / Thunderbolt / ...) was entered on connect
    severity: high
    rationale: >
      Alt-mode entry hands the partner a high-bandwidth or tunnelled transport
      (DisplayPort, Thunderbolt/USB4). Unexpected for a plain data cable and a
      potential DMA / display-capture surface.
    match:
      change: [appeared, modified]
      first_seen_phase: test
      kind: usb_pd
      attributes:
        any:
          - { key: alt_modes, exists: true }
          - { key: port_alt_modes, exists: true }

  # --- USB topology (usb_topology probe) --------------------------

  - id: usb-hub-appeared-in-topology
    title: A USB hub appeared in the bus topology while the cable was connected
    severity: medium
    rationale: >
      A hub that was not present at baseline is how multiple hidden interfaces
      are stacked behind one connector. Corroborates usb-hub-appeared-on-connect
      from a different data source.
    match:
      change: appeared
      first_seen_phase: test
      kind: usb_topology
      label_regex: "hub"

  - id: usb-topology-grew-on-connect
    title: The USB device tree grew while the unknown cable was connected
    severity: low
    rationale: >
      The summary count of USB devices / hubs / tree depth increased during the
      test phase. Expected for the device under test; useful as corroboration.
    match:
      change: modified
      first_seen_phase: test
      kind: usb_topology
      attributes:
        any:
          - { key: device_count, exists: true }
          - { key: external_hub_count, exists: true }

  # --- host state (kernel_modules / mounts / pci probes) --------------------------

  - id: gadget-driver-module-loaded-on-connect
    title: A network / serial / Bluetooth gadget kernel module loaded on connect
    severity: high
    rationale: >
      Auto-loading of a USB *network* (rndis_host, cdc_ncm, cdc_ether, usbnet,
      r8152, ax88), *serial* (cdc_acm, usbserial, ftdi_sio, cp210x, ch341,
      pl2303, option) or *Bluetooth* (btusb) driver in correlation with the
      cable means the cable enumerated that gadget class - which a plain
      charge/data cable never does. Storage drivers (usb_storage / uas / sg) are
      deliberately NOT here: they load for any USB disk, and the block / mount
      probes already flag storage at high severity.
    match:
      change: appeared
      first_seen_phase: test
      kind: kernel_module
      label_regex: "rndis|cdc_ncm|cdc_ether|cdc_mbim|cdc_eem|usbnet|r815[0-9]|ax88|asix|huawei_cdc_ncm|cdc_acm|usbserial|ftdi_sio|cp210x|ch341|pl2303|\\boption\\b|qcserial|btusb|btintel|btbcm"

  - id: removable-media-mounted-on-connect
    title: A filesystem was mounted while the unknown cable was connected
    severity: high
    rationale: >
      An automounted partition means content on the cable's storage was made
      readable (and possibly executable via autorun-style helpers) to the host.
    match:
      change: appeared
      first_seen_phase: test
      kind: mount

  - id: mount-persisted-after-disconnect
    title: A filesystem mounted on connect was still mounted after disconnect
    severity: high
    rationale: >
      A mount that survives cable removal means the host is still reading from
      storage that is no longer physically attached as expected, or that a
      helper re-attached it. Investigate before trusting the host.
    match:
      change: appeared
      first_seen_phase: test
      reverted_after_disconnect: false
      kind: mount

  - id: pci-device-appeared-on-connect
    title: A PCI / Thunderbolt device appeared while the unknown cable was connected
    severity: critical
    rationale: >
      A USB4 / Thunderbolt cable that tunnels PCIe exposes the host to direct
      memory access. A new pci_device correlated with the cable is a serious
      finding.
    match:
      change: appeared
      first_seen_phase: test
      kind: pci_device

  # --- network behaviour (routing / listeners probes) --------------------------

  - id: default-route-changed-on-connect
    title: The default route changed while the unknown cable was connected
    severity: critical
    rationale: >
      If the cable's network gadget became the default route, all off-link
      traffic from the host now transits hardware inside the cable.
    match:
      change: modified
      first_seen_phase: test
      kind: network_config
      label_regex: "default route"

  - id: dns-resolvers-changed-on-connect
    title: The DNS resolvers changed while the unknown cable was connected
    severity: critical
    rationale: >
      A cable that rewrites /etc/resolv.conf controls name resolution for the
      host and can transparently redirect traffic.
    match:
      change: modified
      first_seen_phase: test
      kind: network_config
      label_regex: "DNS resolvers"

  - id: new-listener-on-connect
    title: A process started listening on a fixed TCP port while the cable was connected
    severity: low
    rationale: >
      A new listening socket on a non-ephemeral port appearing in correlation
      with the cable can be a management/callback service brought up by a helper
      the cable triggered. Ordinary service restarts can still land here, so
      treat it as a lead, not a verdict.
    match:
      change: appeared
      first_seen_phase: test
      kind: listening_socket
      attributes:
        all:
          - { key: ephemeral_port, not_equals: "True" }

  - id: new-ephemeral-listener-on-connect
    title: A process started listening on an ephemeral-range TCP port during the test
    severity: info
    rationale: >
      A listener appeared on a high (ephemeral-range) port while the cable was
      connected. These usually churn on their own - RPC, peer discovery, IDE
      helpers - but a callback service can deliberately bind a fixed port up
      here, and the number alone does not prove it is benign. Check what it is.
    match:
      change: appeared
      first_seen_phase: test
      kind: listening_socket
      attributes:
        all:
          - { key: ephemeral_port, equals: "True" }

  # --- Wi-Fi (wifi_scan probe, off by default) --------------------------
  #
  # Wi-Fi scan lists are noisy - neighbouring APs drift in and out of range on
  # their own, and any AP on your own premises is "strong". The only reliable
  # signal for a cable that runs its own AP is: a strong AP that was NOT in
  # range at baseline, appeared on connect, and DISAPPEARED again when the
  # cable was unplugged. That is the single rule below; the "any new AP"
  # catch-all was removed because it was pure noise.

  - id: strong-wifi-ap-appeared-and-reverted
    title: A strong Wi-Fi AP from a new vendor appeared on connect and vanished on disconnect
    severity: high
    rationale: >
      An access point whose vendor was not seen at all at baseline, that came up
      strong while the cable was connected and then went away when the cable was
      unplugged, is behaving exactly like a radio inside the cable or connector.
      Existing enterprise / mesh APs on the premises broadcast a rotating set of
      BSSIDs and are filtered out by matching on the vendor OUI, not the exact
      BSSID.
    match:
      change: appeared
      first_seen_phase: test
      reverted_after_disconnect: true
      kind: wifi_ap
      attributes:
        all:
          - { key: strong_signal, equals: "True" }
          - { key: family_new_this_session, equals: "True" }

  # --- keystroke cadence (keystroke_cadence probe) --------------------------

  - id: keystroke-injection-detected
    title: Key presses with superhuman speed or machine regularity during the test phase
    severity: critical
    rationale: >
      The keystroke timing on an input device matches automated injection -
      either far faster than a human can type, or with a near-zero variation in
      the interval between keys. This is the behavioural signature of a BadUSB
      payload running.
    match:
      change: [appeared, modified]
      first_seen_phase: test
      kind: keystroke_timing
      attributes:
        all:
          - { key: looks_injected, equals: "True" }

  - id: keystrokes-during-test-phase
    title: Key presses were recorded during the test phase
    severity: medium
    rationale: >
      The operator should not be typing during the test window. Key-down events
      on any input device while the cable was connected - even at human speed -
      mean either the operator touched the keyboard or something else did.
    match:
      change: [appeared, modified]
      first_seen_phase: test
      kind: keystroke_timing

  # --- inline power measurement (power probe, off by default) --------------------------

  - id: cable-draws-power-active-electronics
    title: The cable draws measurably more current than the no-cable baseline
    severity: high
    rationale: >
      A passive USB cable, and a simple passive adapter, draw a negligible and
      stable current. A sustained jump means there is powered electronics - a
      microcontroller, a Wi-Fi / BLE radio - in the cable or the connector.
      Current draw cannot be spoofed by USB descriptor fields. NOTE: if you
      connected an actual device at the far end (keyboard, disk, adapter) some
      increase is expected - compare the mA figure to that device's rated
      draw. For a clean test, connect the cable with NOTHING on its far end.
    match:
      change: [appeared, modified]
      first_seen_phase: test
      kind: power_reading
      attributes:
        all:
          - { key: excess_draw, equals: "True" }

  - id: power-current-spiked-during-test
    title: USB current spiked during the test phase beyond the steady-state reading
    severity: high
    rationale: >
      The inline sensor sampled VBUS current throughout the phase and caught one
      or more excursions above the alert threshold that the single end-of-phase
      reading did not show. A cable that charges normally but pulls a burst of
      current when a radio or microcontroller inside it wakes up is only visible
      in the waveform. Compare the spike count and peak against the rated draw
      of any real device you attached to the far end.
    match:
      change: appeared
      first_seen_phase: test
      kind: power_series
      attributes:
        any:
          - { key: current_spike, equals: "True" }
          - { key: sustained_excess, equals: "True" }

  - id: power-waveform-excursion-after-disconnect
    title: USB current or voltage moved during the post-test phase
    severity: medium
    rationale: >
      The VBUS waveform showed a current spike or an out-of-range voltage
      excursion after the cable was unplugged. Something is still drawing from
      or feeding the port, or the cable did not fully disconnect. On a clean
      disconnect the post-test waveform should match baseline.
    match:
      change: appeared
      first_seen_phase: post_test
      kind: power_series

  - id: usb-bus-voltage-out-of-range
    title: USB VBUS voltage left the normal 5 V range while the cable was connected
    severity: medium
    rationale: >
      VBUS should sit near 5 V. A sag can mean the cable or device is pulling
      excessive current or the cable has high resistance; a rise can mean the
      far end is back-feeding power into the host.
    match:
      change: [appeared, modified]
      first_seen_phase: test
      kind: power_reading
      attributes:
        all:
          - { key: voltage_ok, equals: "False" }
