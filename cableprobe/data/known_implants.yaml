#
# USB vendor:product IDs that off-the-shelf BadUSB / keystroke-injection /
# implant tools present in their DEFAULT, un-reconfigured state.
#
# Important:
#   * Almost every tool here CAN be reflashed with a spoofed VID/PID (many
#     ship a "clone a real keyboard" wizard). A match is a strong lead, not
#     proof, and a non-match proves nothing.
#   * Several IDs belong to general-purpose dev boards (Arduino, SparkFun,
#     Teensy, ESP32, STM32). A hobby project using the same board will match.
#     Those are rated `medium` with a note; purpose-built tools are `high`.
#   * Pair every match with the behavioural findings (HID appeared, network
#     gadget, keystroke cadence, current draw, ...).
#
# Add your own with `implants_file:` in the config, or contribute here.

version: 1

implants:
